name: medify
description: "Medify - Precision Health Adherence"
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^15.1.2

  # Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.1
  firebase_messaging: ^15.2.0
  firebase_crashlytics: ^4.3.0
  firebase_remote_config: ^5.3.0
  firebase_storage: ^12.4.0

  # Connectivity (offline-first sync trigger)
  connectivity_plus: ^6.1.0

  # Local Notifications / Alarms
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.0
  permission_handler: ^12.0.1

  # Utilities
  intl: ^0.20.1
  shared_preferences: ^2.3.3
  package_info_plus: ^9.0.0
  google_fonts: ^6.2.1

  # Charts & Calendar (Insights / History screens)
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0

  flutter_lints: ^6.0.0
  custom_lint: ^0.8.0
  medify_lints:
    path: tool/lints/medify_lints

  # Codegen
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  injectable_generator: ^2.6.2

  # Native splash / launcher icon generation
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.1

  # Asset code generation
  flutter_gen_runner: ^5.7.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/songs/

  # Fonts: no bundled font binaries - typefaces come from the google_fonts
  # package instead (see lib/core/design_system/app_theme.dart).

# Flutter Native Splash / Launcher Icons: disabled until the Medify v2 logo
# (teal shield + capsule mark from the Figma file) is exported as a PNG.
# Re-enable both blocks below once assets/images/medify_logo.png exists.
# flutter_native_splash:
#   image: assets/images/medify_logo.png
#   color: "#F3F6FA"
#   color_dark: "#0B1F1F"
#   android_12:
#     image: assets/images/medify_logo.png
#     color: "#F3F6FA"
#     color_dark: "#0B1F1F"
#   ios: true
#   android: true
#
# flutter_launcher_icons:
#   android: true
#   ios: true
#   image_path: "assets/images/medify_logo.png"
#   adaptive_icon_background: "#F3F6FA"
#   adaptive_icon_foreground: "assets/images/medify_logo.png"
#   remove_alpha_ios: true

# Flutter Gen Configuration for type-safe asset access
flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: false
  assets:
    enabled: true
