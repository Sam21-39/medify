name: medify
description: "Medicine Reminder & Tracker App"
publish_to: "none"

version: 2.0.0+5

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^2.0.0
  adaptive_platform_ui: ^1.0.2
  flutter_svg: ^2.0.0
  collection: ^1.19.1

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0

  # Dependency Injection
  get_it: ^9.3.0

  # Local Notifications
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  permission_handler: ^13.0.2

  # Utilities
  intl: ^0.20.1
  path: ^1.9.0
  package_info_plus: ^10.2.2

  # Charts & Visualizations (Phase 2)
  fl_chart: ^1.3.0
  showcaseview: ^5.0.1
  flutter_intro: ^3.4.0

  # Calendar & History (Phase 2)
  table_calendar: ^3.1.2
  csv: ^8.0.0
  share_plus: ^13.3.1

  # UI Enhancements (Phase 2)
  shimmer: ^4.0.0
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.8.0
  go_router: ^18.1.3
  dartz: ^0.10.1
  injectable: ^3.0.0
  sqflite: 2.4.5
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation (flutter_gen_runner needs build_runner)
  build_runner: ^2.4.14
  # Native splash screen generation
  flutter_native_splash: ^2.4.3

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.1

  # Asset code generation
  flutter_gen_runner: ^5.7.0
  injectable_generator: ^3.1.3
  sqflite_common_ffi: 2.4.5
flutter:
  uses-material-design: true
  generate: true
  config:
    enable-swift-package-manager: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/songs/

  # Fonts
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

# Flutter Native Splash Configuration
flutter_native_splash:
  # Logo image (using main logo)
  image: assets/images/Medify.png

  # Background color (using Medify's light background color)
  color: "#FAFAFA"

  # Dark mode configuration
  color_dark: "#111827"
  image_dark: assets/images/Medify.png

  # Android 12+ specific settings
  android_12:
    image: assets/images/Medify.png
    color: "#FAFAFA"
    image_dark: assets/images/Medify.png
    color_dark: "#111827"

  # Web configuration (optional)
  web: false

  # iOS configuration
  ios: true
  android: true

  # Branding mode (keeps splash visible until app is ready)
  android_gravity: center
  ios_content_mode: center

  # Full screen (recommended for splash screens)
  fullscreen: true

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Medify.png"
  adaptive_icon_background: "#FAFAFA"
  adaptive_icon_foreground: "assets/images/Medify.png"
  # Remove default Flutter icon
  remove_alpha_ios: true

# Flutter Gen Configuration for type-safe asset access
flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true
  assets:
    enabled: true
