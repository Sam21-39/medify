name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install pinned Flutter SDK
        run: fvm install

      - name: Resolve dependencies
        run: fvm flutter pub get

      - name: Generate code (drift/injectable/flutter_gen)
        run: fvm dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: fvm dart format --set-exit-if-changed lib test tool

      - name: Analyze
        run: fvm flutter analyze

      - name: Custom lint (module boundaries + no-setState)
        run: fvm dart run custom_lint

      - name: Run tests
        run: fvm flutter test --coverage

      # TODO(Phase 1.1): once the `medify` Firebase project exists, generate
      # lib/firebase_options.dart via `flutterfire configure` and commit it
      # (it holds public client identifiers, not secrets - see docs/DPDP_NOTES.md
      # for what actually needs to stay out of git).

      - name: Smoke build (debug APK)
        run: fvm flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install pinned Flutter SDK
        run: fvm install

      - name: Resolve dependencies
        run: fvm flutter pub get

      - name: Generate code (drift/injectable/flutter_gen)
        run: fvm dart run build_runner build --delete-conflicting-outputs

      - name: Smoke build (iOS, no codesign)
        run: fvm flutter build ios --debug --no-codesign
