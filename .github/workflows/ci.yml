name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install pinned Flutter SDK
        run: fvm install

      - name: Resolve dependencies
        run: fvm flutter pub get

      - name: Generate code (drift/injectable/flutter_gen)
        run: fvm dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: fvm dart format --set-exit-if-changed .

      - name: Analyze
        run: fvm flutter analyze

      - name: Custom lint (module boundaries + no-setState)
        run: fvm dart run custom_lint

      - name: Run tests
        run: fvm flutter test --coverage

      - name: Write dev env file
        run: echo "$ENV_DEV_JSON" > env/dev.json
        env:
          ENV_DEV_JSON: ${{ secrets.ENV_DEV_JSON }}

      - name: Smoke build (dev flavor, debug APK)
        run: fvm flutter build apk --flavor dev --debug --dart-define-from-file=env/dev.json
